name: Render Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-backend-deploy.yml"
  workflow_dispatch:

jobs:
  verify-render-auto-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render auto deploy
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://wms-quickstart.onrender.com/health' }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"
            if [ -n "$body" ]; then
              echo "$body"
              live_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_sha", ""))' <<< "$body" 2>/dev/null || true)"

              if [ "$live_sha" = "$EXPECTED_SHA" ]; then
                echo "Render is live at $EXPECTED_SHA"
                exit 0
              fi

              echo "Attempt $attempt: live build_sha is $live_sha, waiting for $EXPECTED_SHA"
            else
              echo "Attempt $attempt: health endpoint did not return a body"
            fi

            sleep 20
          done

          echo "Render did not report $EXPECTED_SHA from $HEALTH_URL in time"
          exit 1
