name: Release Configuration Gate

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - "release/**"
      - "tools/verify_release_manifest.py"
      - ".github/workflows/render-backend-deploy.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full commit SHA currently deployed to migrated staging"
        required: true
        type: string
      health_url:
        description: "Staging health URL"
        required: false
        default: "https://wms-quickstart-staging.onrender.com/health"
        type: string

jobs:
  verify-release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate environment mapping
        run: |
          set -euo pipefail
          python3 tools/verify_release_manifest.py

  verify-staging-health:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicitly deployed staging commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error "$HEALTH_URL")"
          echo "$body"
          live_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_sha", ""))' <<< "$body")"
          if [ "$live_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected $EXPECTED_SHA but staging reports $live_sha" >&2
            exit 1
          fi
