[project]
name = "wms-quickstart"
version = "0.1.0"
description = "WMS QuickStart - Multi-tenant Cloud WMS for 3PL Warehouses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery[sqs]>=5.4.0",
    "python-multipart>=0.0.12",
    "python-barcode>=0.15.1",
    "weasyprint>=63.0",
    "reportlab>=4.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI intentionally uses Depends/Query/etc. in endpoint signatures.
    "E501",  # Ruff format owns wrapping; long strings/HTML remain readable as literals.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "index",
    "no-any-return",
    "no-untyped-call",
    "return-value",
    "type-arg",
    "union-attr",
    "var-annotated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
