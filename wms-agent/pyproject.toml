[project]
name = "wms-local-agent"
version = "0.1.0"
description = "Local governed agent shell for WMS QuickStart"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "pywebview>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[project.scripts]
wms-local-agent = "local_agent.server:main"
wms-agent-client = "local_agent.client:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_agent"]
artifacts = [
    "local_agent/static/**",
    "local_agent/bundled_skills/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "local_agent/**",
    "skills/**",
    "install/**",
    "scripts/**",
    "tests/**",
    ".env.example",
    "README.md",
    "pyproject.toml",
]
