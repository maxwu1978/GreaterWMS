[project]
name = "wms-mcp"
version = "0.1.0"
description = "MCP server exposing MaxSmart WMS governed operations (tenant/client onboarding, inventory, agent tools)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28.0",
]

[project.scripts]
wms-mcp = "wms_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wms_mcp"]
